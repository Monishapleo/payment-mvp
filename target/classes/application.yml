spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/paymentguard}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: paymentguard-order
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    com.paymentguard: INFO